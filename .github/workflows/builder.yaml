name: Builder

on:
  push:
    branches:
      - main
    paths:
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "**/config.yaml"
      - "**/rootfs/**"
      - ".github/workflows/builder.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "**/config.yaml"
      - "**/rootfs/**"
      - ".github/workflows/builder.yaml"

permissions:
  contents: read

jobs:
  init:
    name: Find add-ons
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - uses: actions/checkout@v6
      - id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  build:
    needs: init
    name: Build ${{ matrix.arch.name }} ${{ matrix.addon }}
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.init.outputs.addons) }}
        arch:
          - name: aarch64
            runner: ubuntu-24.04-arm
          - name: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Read add-on configuration
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Resolve image name
        id: image
        if: contains(fromJSON(steps.info.outputs.architectures), matrix.arch.name)
        env:
          IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
          ARCH: ${{ matrix.arch.name }}
        run: echo "image=${IMAGE/\{arch\}/$ARCH}" >> "$GITHUB_OUTPUT"

      - name: Build and optionally publish
        if: contains(fromJSON(steps.info.outputs.architectures), matrix.arch.name)
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch.name }}
          context: "./${{ matrix.addon }}"
          image: ${{ steps.image.outputs.image }}
          image-tags: |
            ${{ fromJSON(steps.info.outputs.version) }}
            latest
          version: ${{ fromJSON(steps.info.outputs.version) }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cosign: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-gha-scope: ${{ matrix.addon }}
          labels: |
            io.hass.type=addon
            io.hass.name=${{ fromJSON(steps.info.outputs.name) }}
            io.hass.description=${{ fromJSON(steps.info.outputs.description) }}
            io.hass.url=${{ fromJSON(steps.info.outputs.url) }}
